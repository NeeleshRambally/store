services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: store
    ports:
      - "5434:5432"
    volumes:
      - store-postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d store"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${STORE_IMAGE:-store:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/store
      DB_USERNAME: admin
      DB_PASSWORD: admin
      LIQUIBASE_CONTEXTS: seed
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    restart: "no"

  store:
    build: .
    image: ${STORE_IMAGE:-store:local}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/store
      DB_USERNAME: store_app
      DB_PASSWORD: store_app
      SPRING_LIQUIBASE_ENABLED: "false"
    stop_grace_period: 30s
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  store-postgres:
