services:
  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: store
    ports:
      - "5434:5432"
    volumes:
      - store-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d store"]
      interval: 5s
      timeout: 3s
      retries: 10

  store:
    build: .
    image: store:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/store
      DB_USERNAME: admin
      DB_PASSWORD: admin
      LIQUIBASE_CONTEXTS: seed
    ports:
      - "8080:8080"

volumes:
  store-postgres:
