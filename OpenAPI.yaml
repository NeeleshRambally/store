openapi: 3.0.0
info:
  title: store
  version: '3.1.0'
  description: >-
    A simple store. Every error handled by the service's Spring MVC layer on the API port is an
    RFC 7807 problem detail (application/problem+json) with the statuses declared per operation
    below. A method that is not listed on a path (for example DELETE /order/1, which the
    pipeline's smoke test sends) answers a 405 problem detail with the code method_not_allowed,
    whatever body it carries, which is not read; OpenAPI cannot declare a response for a method
    the contract does not define, so that case is stated here instead. A request the HTTP server
    rejects before that layer (a request line and headers over 8 KB, or a path holding %00, %2F,
    a % not followed by two hexadecimal digits or bytes that are not UTF-8) gets a text/html 400
    without X-Request-Id. Every problem detail
    carries a code, the stable identity of the problem
    (the values are listed in the ProblemDetail schema; type stays about:blank): branch on the
    code, never on the detail text, which may change. A client must accept a code it does not
    know and handle it by the status, because adding a code is a minor version of this contract;
    removing or renaming one is a major version. The version is that of the contract itself,
    independent of the version of the service that implements it; 2.0.0 is incompatible with
    the delivered 1.0, 2.1.0 adds the code database_timeout, 3.0.0 bounds page at 21474836,
    3.1.0 adds the optional Idempotency-Key request header and the Idempotent-Replayed response
    header on the three POSTs with the codes invalid_idempotency_key, idempotency_key_reused and
    idempotency_request_in_progress (a 3.0.0 client that sends no key needs no change), and
    docs/ASSUMPTIONS.md ("Contract version and client migration") lists what a client of an
    earlier version has to change.
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'http://localhost:8080'
    description: >-
      Local development (./gradlew bootRun or the Compose stack). The public base URL is set by
      the gateway in front of the service (ADR 0002), so no production server is listed here.
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/orderSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK; an offset page, or a cursor page when after is present
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderPage'
                  - $ref: '#/components/schemas/OrderCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getOrders
      description: >-
        Get a page of orders, each with its customer and the products it contains, optionally
        restricted to the orders of one customer (customerId) or to the orders containing one
        product (productId); the two filters cannot be combined. Without after the page is
        addressed by page and size; with after the page is the (matching) orders whose id is
        greater than after, in ascending id order (keyset pagination, cheaper for deep pages).
    post:
      summary: Create Order
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Created, or the replayed response of the earlier request with the same Idempotency-Key
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createOrder
      description: >-
        Create a new order for an existing customer containing the given products; the response
        carries the customer and the products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  /order/{id}:
    get:
      summary: Get Order
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Written in ASCII decimal digits, without a plus sign or leading zeros and with a minus
            sign only before a non-zero digit. Any other value (such as abc, the hexadecimal 0x1,
            +1, 01, a digit outside ASCII such as the fullwidth U+FF11, or digits with whitespace
            around or between them) or one outside the 64-bit range is rejected with 400.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getOrder
      description: Get a single order by id, with its customer and the products it contains
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      parameters:
        - name: name
          in: query
          required: false
          description: >-
            Case-insensitive substring of one word of the customer's name. Must be a single word:
            no ASCII whitespace (space, tab, line feed, vertical tab, form feed, carriage
            return) and no C0 control character or DEL (U+0000 to U+001F, U+007F); any other
            character, including a no-break space, a C1 control such as U+0085 and U+2028, is
            part of the word and matched literally. When omitted, all customers are returned. A %
            in the word is sent as %25: a query string the server cannot parse in full, such as
            name=50% (a % must be followed by two hexadecimal digits) or one holding a nameless
            value (=1), is rejected with 400, whichever parameter it affects.
          schema:
            type: string
            pattern: '^[^ \t\r\n\f\u000B\u0000-\u001F\u007F]+$'
            example: onne
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/customerSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK; an offset page, or a cursor page when after is present
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerPage'
                  - $ref: '#/components/schemas/CustomerCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getCustomers
      description: >-
        Get a page of customers, each with its orders, optionally filtered by a word substring of
        the name. Without after the page is addressed by page and size; with after the page is the
        (matching) customers whose id is greater than after, in ascending id order.
    post:
      summary: Create Customer
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Created, or the replayed response of the earlier request with the same Idempotency-Key
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
  /customer/{id}:
    get:
      summary: Get Customer
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Written in ASCII decimal digits, without a plus sign or leading zeros and with a minus
            sign only before a non-zero digit. Any other value (such as abc, the hexadecimal 0x1,
            +1, 01, a digit outside ASCII such as the fullwidth U+FF11, or digits with whitespace
            around or between them) or one outside the 64-bit range is rejected with 400.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getCustomer
      description: >-
        Get a single customer by id, with its newest orders (bounded like the list items) and
        orderCount, the total
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/productSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK; an offset page, or a cursor page when after is present
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProductPage'
                  - $ref: '#/components/schemas/ProductCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getProducts
      description: >-
        Get a page of products, each with the ids of its newest orders (bounded, see
        Product.orders) and orderCount. Without after the page is addressed by page and size; with
        after the page is the products whose id is greater than after, in ascending id order.
    post:
      summary: Create Product
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Created, or the replayed response of the earlier request with the same Idempotency-Key
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createProduct
      description: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
  /products/{id}:
    get:
      summary: Get Product
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Written in ASCII decimal digits, without a plus sign or leading zeros and with a minus
            sign only before a non-zero digit. Any other value (such as abc, the hexadecimal 0x1,
            +1, 01, a digit outside ASCII such as the fullwidth U+FF11, or digits with whitespace
            around or between them) or one outside the 64-bit range is rejected with 400.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getProduct
      description: >-
        Get a single product with the ids of its newest orders (bounded, see Product.orders) and
        orderCount
components:
  parameters:
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        The ETag of a previously received representation. When it still matches, the response is
        304 Not Modified with no body and the current ETag; otherwise the full response is sent.
      schema:
        type: string
        example: W/"0b9f4a2c7d8e1f3a5b6c7d8e9f0a1b2c3"
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key the client chooses for this request: 1 to 255 visible ASCII characters (no space, no
        control character, nothing outside ASCII), compared exactly, so a key written in another
        case is another key; use a random value such as a UUID. A POST sent with a key is stored
        with a fingerprint of its path and bound body and with its response for the key's lifetime
        (24 hours by default, IDEMPOTENCY_TTL), and a repeat of the same request with the same key
        within that time is answered with the stored status, Location and body, marked
        Idempotent-Replayed: true, without creating anything again; the same request is the same
        path and the same bound body, whatever its whitespace or property order. The same key sent
        with another path or body is rejected with 422 (idempotency_key_reused), and a repeat that
        arrives while the first request is still being processed with 409
        (idempotency_request_in_progress) and Retry-After: 1. A request that fails is not stored,
        so its key may be sent again with a corrected request. A key is scoped to the calling
        client; until the service authenticates callers (ADR 0002) every caller is one client,
        which is why keys must be random. A value outside the pattern is rejected with 400
        (invalid_idempotency_key). Without the header the POST behaves as it always did.
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,255}$'
        minLength: 1
        maxLength: 255
        example: 7f3c2a1e-9b4d-4c6e-8a2f-1d5e6f7a8b9c
    page:
      name: page
      in: query
      description: >-
        Zero-based page index, at most 21474836, so that the offset of a page (page times size)
        stays within the 32-bit range at the largest size, 100; positions further on are reached
        with after. A value below 0 or above 21474836 is rejected with 400 naming page; a value
        that is not written in ASCII decimal digits without a plus sign or leading zeros (such as
        0x2, +1, 01 or -0) or one outside the 32-bit range is rejected with 400 as well. An empty
        value or one made only of whitespace (page= or page=%20) counts as absent: page 0 is
        returned. A query string the server cannot parse in full, such as page=%ZZ (a % must be
        followed by two hexadecimal digits) or one holding a nameless value (=1), is rejected with
        400, whichever parameter it affects.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 21474836
        default: 0
    size:
      name: size
      in: query
      description: >-
        Page size. Values above 100 are accepted and capped at 100 rather than rejected, so the
        schema carries no maximum; the size echoed in the response is the effective one. A value
        below 1 is rejected with 400 naming size; a value that is not written in ASCII decimal
        digits without a plus sign or leading zeros (such as 0x10, +5 or 05) or one outside the
        32-bit range is rejected with 400 as well. An empty value or one made only of whitespace
        (size= or size=%09) counts as absent: the default 20 applies. A query string the server
        cannot parse in full, such as size=%ZZ (a % must be followed by two hexadecimal digits) or
        one holding a nameless value (=1), is rejected with 400, whichever parameter it affects.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
    after:
      name: after
      in: query
      required: false
      description: >-
        Cursor: return the elements whose id is greater than this value, in ascending id order,
        and respond with a CursorPage instead of a Page. Use 0 to start a walk and the previous
        response's nextCursor to continue it; a null nextCursor means the walk is complete. The
        page size is still size (default 20, capped at 100). after cannot be combined with page
        (other than 0) or with a sort whose first property is not id ascending: such a request is
        rejected with 400 (see the cursorWithPage example of the BadRequest response). A value
        below 0 is rejected with 400 naming after; a value that is not written in ASCII decimal
        digits without a plus sign or leading zeros (such as 0x10, +1, 01 or -0) or one outside
        the 64-bit range is rejected with 400 as well. An empty value or one made only of
        whitespace (after= or after=%20) counts as absent: the response is an offset Page. A query
        string the server cannot parse in full, such as after=%ZZ (a % must be followed by two
        hexadecimal digits) or one holding a nameless value (=1), is rejected with 400, whichever
        parameter it affects.
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 0
    customerId:
      name: customerId
      in: query
      required: false
      description: >-
        Only the orders placed by this customer, in both paging modes. An id that matches no
        order (including an unknown customer) yields an empty page with totalElements 0, not a
        404. A value below 1 is rejected with 400 naming customerId; a value that is not written in
        ASCII decimal digits without a plus sign or leading zeros (such as 0x1, +1 or 01) or one
        outside the 64-bit range is rejected with 400 as well. An empty value or one made only of
        whitespace (customerId= or customerId=%20) counts as absent: the orders are not filtered
        by customer. A query string the server cannot parse in full, such as customerId=1% (a %
        must be followed by two hexadecimal digits) or one holding a nameless value (=1), is
        rejected with 400, whichever parameter it affects.
        Cannot be combined with productId: such a request is rejected with 400 (see the
        combinedFilters example of the BadRequest response).
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1
    productId:
      name: productId
      in: query
      required: false
      description: >-
        Only the orders that contain this product, in both paging modes. An id that matches no
        order (including an unknown product) yields an empty page with totalElements 0, not a
        404. A value below 1 is rejected with 400 naming productId; a value that is not written in
        ASCII decimal digits without a plus sign or leading zeros (such as 0x1, +1 or 01) or one
        outside the 64-bit range is rejected with 400 as well. An empty value or one made only of
        whitespace (productId= or productId=%20) counts as absent: the orders are not filtered by
        product. A query string the server cannot parse in full, such as productId=2%G (a % must
        be followed by two hexadecimal digits) or one holding a nameless value (=1), is rejected
        with 400, whichever parameter it affects.
        Cannot be combined with customerId: such a request is rejected with 400 (see the
        combinedFilters example of the BadRequest response).
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 2
    orderSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is
        the contract: the only accepted properties are id and description. Any other property,
        including nested paths such as customer.name, is rejected with 400 (see the
        unknownSortProperty example of the BadRequest response). Ties are broken by id in the
        same direction as the last sort property, so page boundaries are deterministic. Repeat
        the parameter to sort by more than one property; it is the only query parameter that may
        be repeated.
      schema:
        type: string
        example: description,desc
    customerSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is
        the contract: the only accepted properties are id and name. Any other property,
        including nested paths such as orders.description, is rejected with 400 (see the
        unknownSortProperty example of the BadRequest response). Ties are broken by id in the
        same direction as the last sort property, so page boundaries are deterministic. Repeat
        the parameter to sort by more than one property; it is the only query parameter that may
        be repeated.
      schema:
        type: string
        example: name,asc
    productSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is
        the contract: the only accepted properties are id and description. Any other property is
        rejected with 400 (see the unknownSortProperty example of the BadRequest response). Ties
        are broken by id in the same direction as the last sort property, so page boundaries are
        deterministic. Repeat the parameter to sort by more than one property; it is the only
        query parameter that may be repeated.
      schema:
        type: string
        example: description,asc
  headers:
    RequestId:
      description: >-
        Correlation id of the request, on every response of every operation. The inbound
        X-Request-Id is echoed when it matches the pattern; otherwise, or when absent, a UUID is
        generated. Quote it when reporting a problem: it is on every log line of the request.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
        example: 7f3c2a1e-9b4d-4c6e-8a2f-1d5e6f7a8b9c
    Location:
      description: >-
        The path of the created resource (/order/{id}, /products/{id} or /customer/{id}),
        relative to the server that answered so that a gateway rewriting the host stays correct
      required: true
      schema:
        type: string
        example: /order/10001
    RetryAfter:
      description: >-
        Seconds after which the request may be retried; sent with every 503, and with the 409 of
        a request whose Idempotency-Key is still being processed (always 1 there)
      required: true
      schema:
        type: string
        example: '5'
    IdempotentReplayed:
      description: >-
        Present, with the value true, on a 201 that replays the stored response of the earlier
        request with the same Idempotency-Key; absent when this request created the resource
      required: false
      schema:
        type: string
        enum:
          - 'true'
    ETag:
      description: >-
        Weak validator of the response body (W/"..."), on every 200 and 304 of a GET; send it
        back in If-None-Match to revalidate. Weak so that the body can still be compressed.
      required: true
      schema:
        type: string
    CacheControl:
      description: >-
        Always no-cache, on every 200 and 304 of a GET: the response may be stored but must be
        revalidated with If-None-Match before it is reused.
      required: true
      schema:
        type: string
        example: no-cache
  responses:
    NotModified:
      description: >-
        The representation has not changed since the ETag given in If-None-Match; the body is
        empty and the ETag is repeated
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    BadRequest:
      description: >-
        The request is malformed, has a query string that cannot be parsed in full, fails
        validation, repeats a query parameter other than sort, sorts by a property outside the
        documented list, combines after with page or sort, combines customerId with productId, or
        carries an Idempotency-Key outside its pattern
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownSortProperty:
              summary: GET /order?sort=customer.name
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: 'Unknown sort property: customer.name'
                instance: /order
                code: invalid_sort
            cursorWithPage:
              summary: GET /order?after=0&page=1
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: after cannot be combined with page or sort
                instance: /order
                code: invalid_cursor
            combinedFilters:
              summary: GET /order?customerId=1&productId=2
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: customerId and productId cannot be combined
                instance: /order
                code: conflicting_filters
            invalidIdempotencyKey:
              summary: POST /customer with an Idempotency-Key holding a space
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Idempotency-Key must be 1 to 255 visible ASCII characters
                instance: /customer
                code: invalid_idempotency_key
    NotFound:
      description: >-
        The referenced resource does not exist: the id in the path, or the customer or a
        product named in a POST /order body (the detail names the lowest missing product id)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownOrder:
              summary: GET /order/999999
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Order with id 999999 was not found
                instance: /order/999999
                code: not_found
            unknownProduct:
              summary: GET /products/999999
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Product with id 999999 was not found
                instance: /products/999999
                code: not_found
            unknownCustomer:
              summary: GET /customer/999999
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Customer with id 999999 was not found
                instance: /customer/999999
                code: not_found
    NotAcceptable:
      description: >-
        The Accept header admits neither application/json nor application/problem+json, the
        media types every operation produces. The request was not processed: the 406 is
        decided before the parameters are validated or the body is read, so a POST created
        nothing. An Accept that also admits */*, as a browser's does, is served JSON.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            orderAsXml:
              summary: GET /order/1 with Accept application/xml
              value:
                type: about:blank
                title: Not Acceptable
                status: 406
                detail: 'Acceptable representations: [application/json, application/problem+json].'
                instance: /order/1
                code: not_acceptable
    Conflict:
      description: >-
        Either the write conflicts with existing data (a database constraint rejected it; code
        conflict), or a request with the same Idempotency-Key is still being processed (code
        idempotency_request_in_progress, with Retry-After: 1; repeat the request after that delay
        to receive its stored response); the body is a problem detail without internal details
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: >-
            Sent with the code idempotency_request_in_progress only, always 1; absent with the
            code conflict
          required: false
          schema:
            type: string
            example: '1'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            constraintViolation:
              summary: POST /order whose insert a database constraint rejects
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The request conflicts with existing data
                instance: /order
                code: conflict
            requestInProgress:
              summary: POST /customer repeated with its Idempotency-Key while the first request is still running
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: A request with this Idempotency-Key is still in progress
                instance: /customer
                code: idempotency_request_in_progress
    UnprocessableEntity:
      description: >-
        The Idempotency-Key was already used, within its lifetime, for a request with another path
        or body; a key identifies one request, so a new request needs a new key
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            idempotencyKeyReused:
              summary: POST /customer with the Idempotency-Key of an earlier request and another name
              value:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Idempotency-Key was already used with a different request
                instance: /customer
                code: idempotency_key_reused
    PayloadTooLarge:
      description: >-
        The application/json request body exceeds the configured bound (65536 bytes by default,
        REQUEST_MAX_BODY_BYTES), judged by the declared Content-Length before any byte is read or
        by the bytes counted while a chunked body is read; the connection is closed after the
        response
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Payload Too Large
            status: 413
            detail: Request body exceeds 65536 bytes
            instance: /order
            code: payload_too_large
    UnsupportedMediaType:
      description: >-
        The Content-Type is missing or is not application/json (for example a URL-encoded or
        multipart form, text or a JSON-based type such as application/vnd.api+json), so the
        request was rejected when it was mapped and its body was not read; the Accept header names
        application/json
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Content-Type 'text/plain;charset=UTF-8' is not supported.
            instance: /order
            code: unsupported_media_type
    ServerError:
      description: >-
        An unexpected failure; the body is a problem detail without internal details (no
        detail property, no stack trace)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            instance: /order
            code: internal_error
    ServiceUnavailable:
      description: >-
        The database cannot serve the request; retry after the Retry-After delay. The code
        service_unavailable means that no database connection could be obtained (the pool's
        connection-timeout of 5 s elapsed, or the database is unreachable), that the connection
        was lost during the request, including a database that sent nothing for the socket
        timeout (15 s by default), or that the transaction timeout (15 s by default) had expired
        before a read by id or a POST's insert; a POST whose session the database terminates
        while its insert is committed, as a database restart does, is answered with a 500
        instead. database_timeout means that a statement was cancelled, normally at the
        statement timeout (10 s by default) or at the deadline of the transaction timeout, or
        that a query came after that deadline. On a POST the write may or may not have been
        applied; a POST sent with an Idempotency-Key can be repeated with the same key and body,
        and the repeat replays the stored response when the first attempt was committed and runs
        the request afresh when it was not
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            serviceUnavailable:
              summary: GET /order?size=5 whose database connection is lost
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The service cannot obtain a database connection
                instance: /order
                code: service_unavailable
            databaseTimeout:
              summary: GET /order?size=5 whose statement is cancelled
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The database did not answer in time
                instance: /order
                code: database_timeout
  schemas:
    ProblemDetail:
      title: ProblemDetail
      type: object
      description: RFC 7807 problem details
      required:
        - code
      properties:
        type:
          type: string
          format: uri
          description: Always about:blank; the problem is identified by code
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: >-
            Stable identity of the problem. validation_failed: a body field or a query parameter
            breaks a constraint, or a body value has the wrong JSON type or lies beyond the
            64-bit range (errors names each). invalid_parameter: a path or query parameter that
            cannot be converted (GET /order/abc, page=abc), a query string that cannot be parsed
            in full (customerId=1%), or a query parameter other than sort that is repeated (errors
            names it). unknown_property: the body carries a property the request does not define
            (errors names it). malformed_body: the body is not one JSON
            object that can be read (malformed JSON, another JSON value, a repeated property,
            content after the object). invalid_sort: a sort property outside the documented
            list. invalid_cursor: after combined with page or sort (see the after parameter).
            conflicting_filters: customerId combined with productId. not_found: the resource, or
            a customer or product named in the body, does not exist. conflict: the write
            conflicts with existing data. payload_too_large, unsupported_media_type,
            not_acceptable and method_not_allowed: the conditions their statuses name.
            service_unavailable: no database connection could be obtained, the connection was
            lost during the request (a POST whose session the database terminates while its
            insert is committed is an internal_error instead), or the transaction's deadline had
            passed before a read by id or a POST's insert. database_timeout: a database
            statement was cancelled, or a query came after the transaction's deadline.
            invalid_idempotency_key: the Idempotency-Key header is outside its pattern.
            idempotency_key_reused: the Idempotency-Key was already used for a request with
            another path or body. idempotency_request_in_progress: a request with the same
            Idempotency-Key is still being processed; retry after the Retry-After delay.
            internal_error: an unexpected failure. A client must accept a code that is not
            listed here (see the description of the API).
          enum:
            - validation_failed
            - invalid_parameter
            - unknown_property
            - malformed_body
            - invalid_sort
            - invalid_cursor
            - conflicting_filters
            - not_found
            - conflict
            - payload_too_large
            - unsupported_media_type
            - not_acceptable
            - method_not_allowed
            - service_unavailable
            - database_timeout
            - invalid_idempotency_key
            - idempotency_key_reused
            - idempotency_request_in_progress
            - internal_error
        errors:
          type: array
          description: >-
            Present with the codes validation_failed and unknown_property, and with the
            invalid_parameter of a repeated query parameter, naming each field by its path
            (productIds[0]) or the query parameter by its name
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      additionalProperties: false
      required:
        - description
        - customerId
        - productIds
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Single-line text that is not blank: no control character (U+0000 to U+001F or
            U+007F, so no tab or line break) and at least one character that is not whitespace
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
        customerId:
          type: integer
          format: int64
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: >-
            Ids of the products contained in the order, between 1 and 100 of them, without
            repetition; every id must exist
          items:
            type: integer
            format: int64
    CreateProductRequest:
      title: CreateProductRequest
      type: object
      additionalProperties: false
      required:
        - description
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Single-line text that is not blank: no control character (U+0000 to U+001F or
            U+007F, so no tab or line break) and at least one character that is not whitespace
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    Product:
      title: Product
      type: object
      required:
        - id
        - description
        - orders
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          description: >-
            Ids of the newest orders that contain this product (the highest ids), at most the
            configured limit (20 by default), in ascending id order; the full list is
            GET /order?productId={id}
          items:
            type: integer
            format: int64
        orderCount:
          type: integer
          format: int64
          description: Total number of orders that contain this product, listed or not
    ProductPage:
      title: ProductPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    ProductCursorPage:
      title: ProductCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    CreateCustomerRequest:
      title: CreateCustomerRequest
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Single-line text that is not blank: no control character (U+0000 to U+001F or
            U+007F, so no tab or line break) and at least one character that is not whitespace
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    Order:
      title: Order
      type: object
      required:
        - id
        - description
        - customer
        - products
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        products:
          type: array
          description: >-
            The products contained in the order, ascending by id. Every order created through
            this API has at least one. An order that predates changeset 5, which added products,
            has none in a database migrated without the sample data and is returned with an
            empty list, which is why the schema declares no minItems.
          items:
            type: object
            required:
              - id
              - description
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    Customer:
      title: Customer
      type: object
      required:
        - id
        - name
        - orders
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          description: >-
            The newest orders of the customer (the highest ids), at most the configured limit
            (20 by default), in ascending id order; the full list is GET /order?customerId={id}
          items:
            type: object
            required:
              - id
              - description
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
        orderCount:
          type: integer
          format: int64
          description: Total number of orders of the customer, listed or not
    OrderPage:
      title: OrderPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    OrderCursorPage:
      title: OrderCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    CustomerPage:
      title: CustomerPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    CustomerCursorPage:
      title: CustomerCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    Page:
      title: Page
      type: object
      description: Offset page envelope, returned when after is absent
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
          description: Zero-based index of this page
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CursorPage:
      title: CursorPage
      type: object
      description: Cursor page envelope, returned when after is present; it carries no totals
      required:
        - content
        - size
        - nextCursor
      properties:
        content:
          type: array
          items: {}
        size:
          type: integer
          description: The requested page size; the content may be shorter on the last page
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: >-
            The id of the last element when more elements exist, to pass as after on the next
            request; null when the walk is complete
tags:
  - name: store
    description: store operations
