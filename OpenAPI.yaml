openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: A simple store
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/orderSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getOrders
      description: Get a page of orders, each with its customer
    post:
      summary: Create Order
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: createOrder
      description: Create a new order for an existing customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  /order/{id}:
    get:
      summary: Get Order
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getOrder
      description: Get a single order by id, with its customer
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      parameters:
        - name: name
          in: query
          required: false
          description: >-
            Case-insensitive substring of one word of the customer's name. Must be a single word
            (no whitespace). When omitted, all customers are returned.
          schema:
            type: string
            pattern: '^\S+$'
            example: onne
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/customerSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getCustomers
      description: Get a page of customers, each with its orders, optionally filtered by a word substring of the name
    post:
      summary: Create Customer
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/productSort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getProducts
      description: Get a page of products, each with the ids of the orders that contain it
    post:
      summary: Create Product
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: createProduct
      description: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
  /products/{id}:
    get:
      summary: Get Product
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getProduct
      description: Get a single product with the ids of the orders that contain it
components:
  parameters:
    page:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      description: Page size; values above 100 are capped at 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    orderSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is the
        contract: the only accepted properties are id and description. Any other property,
        including nested paths such as customer.name, is rejected with 400 (see the
        unknownSortProperty example of the BadRequest response).
      schema:
        type: string
        example: description,desc
    customerSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is the
        contract: the only accepted properties are id and name. Any other property, including
        nested paths such as orders.description, is rejected with 400 (see the
        unknownSortProperty example of the BadRequest response).
      schema:
        type: string
        example: name,asc
    productSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is the
        contract: the only accepted properties are id and description. Any other property is
        rejected with 400 (see the unknownSortProperty example of the BadRequest response).
      schema:
        type: string
        example: description,asc
  responses:
    BadRequest:
      description: The request is malformed, fails validation or sorts by a property outside the documented list
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownSortProperty:
              summary: GET /order?sort=customer.name
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: 'Unknown sort property: customer.name'
                instance: /order
    NotFound:
      description: The referenced resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      title: ProblemDetail
      type: object
      description: RFC 7807 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Present on validation failures
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      required:
        - description
        - customerId
        - productIds
      properties:
        description:
          type: string
          maxLength: 255
        customerId:
          type: integer
          format: int64
        productIds:
          type: array
          minItems: 1
          description: Ids of the products contained in the order; every id must exist
          items:
            type: integer
            format: int64
    CreateProductRequest:
      title: CreateProductRequest
      type: object
      required:
        - description
      properties:
        description:
          type: string
          maxLength: 255
    Product:
      title: Product
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          description: Ids of the orders that contain this product, ascending
          items:
            type: integer
            format: int64
    ProductPage:
      title: ProductPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    CreateCustomerRequest:
      title: CreateCustomerRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
    Order:
      title: Order
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    Customer:
      title: Customer
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    OrderPage:
      title: OrderPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    CustomerPage:
      title: CustomerPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    Page:
      title: Page
      type: object
      properties:
        page:
          type: integer
          description: Zero-based index of this page
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
tags:
  - name: store
    description: store operations
