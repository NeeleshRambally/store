openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: A simple store
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/orderSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK; an offset page, or a cursor page when after is present
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderPage'
                  - $ref: '#/components/schemas/OrderCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getOrders
      description: >-
        Get a page of orders, each with its customer and the products it contains, optionally
        restricted to the orders of one customer (customerId) or to the orders containing one
        product (productId); the two filters cannot be combined. Without after the page is
        addressed by page and size; with after the page is the (matching) orders whose id is
        greater than after, in ascending id order (keyset pagination, cheaper for deep pages).
    post:
      summary: Create Order
      tags:
        - store
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createOrder
      description: >-
        Create a new order for an existing customer containing the given products; the response
        carries the customer and the products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  /order/{id}:
    get:
      summary: Get Order
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: A non-numeric value is rejected with 400
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getOrder
      description: Get a single order by id, with its customer and the products it contains
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      parameters:
        - name: name
          in: query
          required: false
          description: >-
            Case-insensitive substring of one word of the customer's name. Must be a single word:
            no ASCII whitespace (space, tab, line feed, vertical tab, form feed, carriage
            return); any other character, a no-break space included, is part of the word and
            matched literally. When omitted, all customers are returned.
          schema:
            type: string
            pattern: '^[^ \t\r\n\f\u000B]+$'
            example: onne
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/customerSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK; an offset page, or a cursor page when after is present
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerPage'
                  - $ref: '#/components/schemas/CustomerCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getCustomers
      description: >-
        Get a page of customers, each with its orders, optionally filtered by a word substring of
        the name. Without after the page is addressed by page and size; with after the page is the
        (matching) customers whose id is greater than after, in ascending id order.
    post:
      summary: Create Customer
      tags:
        - store
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
  /customer/{id}:
    get:
      summary: Get Customer
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: A non-numeric value is rejected with 400
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getCustomer
      description: >-
        Get a single customer by id, with its newest orders (bounded like the list items) and
        orderCount, the total
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/productSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK; an offset page, or a cursor page when after is present
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProductPage'
                  - $ref: '#/components/schemas/ProductCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getProducts
      description: >-
        Get a page of products, each with the ids of the orders that contain it. Without after the
        page is addressed by page and size; with after the page is the products whose id is greater
        than after, in ascending id order.
    post:
      summary: Create Product
      tags:
        - store
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createProduct
      description: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
  /products/{id}:
    get:
      summary: Get Product
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: A non-numeric value is rejected with 400
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getProduct
      description: Get a single product with the ids of the orders that contain it
components:
  parameters:
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        The ETag of a previously received representation. When it still matches, the response is
        304 Not Modified with no body and the current ETag; otherwise the full response is sent.
      schema:
        type: string
        example: W/"0b9f4a2c7d8e1f3a5b6c7d8e9f0a1b2c3"
    page:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      description: >-
        Page size. Values above 100 are accepted and capped at 100 rather than rejected, so the
        schema carries no maximum; the size echoed in the response is the effective one.
      schema:
        type: integer
        minimum: 1
        default: 20
    after:
      name: after
      in: query
      required: false
      description: >-
        Cursor: return the elements whose id is greater than this value, in ascending id order,
        and respond with a CursorPage instead of a Page. Use 0 to start a walk and the previous
        response's nextCursor to continue it; a null nextCursor means the walk is complete. The
        page size is still size (default 20, capped at 100). after cannot be combined with page
        (other than 0) or with a sort whose first property is not id ascending: such a request is
        rejected with 400 (see the cursorWithPage example of the BadRequest response).
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 0
    customerId:
      name: customerId
      in: query
      required: false
      description: >-
        Only the orders placed by this customer, in both paging modes. An id that matches no
        order (including an unknown customer) yields an empty page with totalElements 0, not a
        404; a value below 1 is rejected with 400. Cannot be combined with productId: such a
        request is rejected with 400 (see the combinedFilters example of the BadRequest
        response).
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1
    productId:
      name: productId
      in: query
      required: false
      description: >-
        Only the orders that contain this product, in both paging modes. An id that matches no
        order (including an unknown product) yields an empty page with totalElements 0, not a
        404; a value below 1 is rejected with 400. Cannot be combined with customerId: such a
        request is rejected with 400 (see the combinedFilters example of the BadRequest
        response).
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 2
    orderSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is the
        contract: the only accepted properties are id and description. Any other property,
        including nested paths such as customer.name, is rejected with 400 (see the
        unknownSortProperty example of the BadRequest response). Ties are broken by id in the
        same direction as the last sort property, so page boundaries are deterministic.
      schema:
        type: string
        example: description,desc
    customerSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is the
        contract: the only accepted properties are id and name. Any other property, including
        nested paths such as orders.description, is rejected with 400 (see the
        unknownSortProperty example of the BadRequest response). Ties are broken by id in the
        same direction as the last sort property, so page boundaries are deterministic.
      schema:
        type: string
        example: name,asc
    productSort:
      name: sort
      in: query
      description: >-
        Sort criteria in the form property,(asc|desc); defaults to id ascending. This list is the
        contract: the only accepted properties are id and description. Any other property is
        rejected with 400 (see the unknownSortProperty example of the BadRequest response).
        Ties are broken by id in the same direction as the last sort property, so page
        boundaries are deterministic.
      schema:
        type: string
        example: description,asc
  headers:
    RequestId:
      description: >-
        Correlation id of the request, on every response of every operation. The inbound
        X-Request-Id is echoed when it matches the pattern; otherwise, or when absent, a UUID is
        generated. Quote it when reporting a problem: it is on every log line of the request.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
        example: 7f3c2a1e-9b4d-4c6e-8a2f-1d5e6f7a8b9c
    Location:
      description: >-
        The path of the created resource (/order/{id}, /products/{id} or /customer/{id}),
        relative to the server that answered so that a gateway rewriting the host stays correct
      required: true
      schema:
        type: string
        example: /order/10001
    RetryAfter:
      description: >-
        Seconds after which the request may be retried; sent with every 503
      required: true
      schema:
        type: string
        example: '5'
    ETag:
      description: >-
        Weak validator of the response body (W/"..."); send it back in If-None-Match to
        revalidate. Weak so that the body can still be compressed.
      schema:
        type: string
    CacheControl:
      description: >-
        Always no-cache: the response may be stored but must be revalidated with If-None-Match
        before it is reused.
      schema:
        type: string
        example: no-cache
  responses:
    NotModified:
      description: >-
        The representation has not changed since the ETag given in If-None-Match; the body is
        empty and the ETag is repeated
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    BadRequest:
      description: >-
        The request is malformed, fails validation, sorts by a property outside the documented
        list, combines after with page or sort, or combines customerId with productId
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownSortProperty:
              summary: GET /order?sort=customer.name
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: 'Unknown sort property: customer.name'
                instance: /order
            cursorWithPage:
              summary: GET /order?after=0&page=1
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: after cannot be combined with page or sort
                instance: /order
            combinedFilters:
              summary: GET /order?customerId=1&productId=2
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: customerId and productId cannot be combined
                instance: /order
    NotFound:
      description: The referenced resource does not exist
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: >-
        The write conflicts with existing data (a database constraint rejected it); the body
        is a problem detail without internal details
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The request conflicts with existing data
            instance: /order
    PayloadTooLarge:
      description: >-
        The request body exceeds the configured bound (65536 bytes by default, REQUEST_MAX_BODY_BYTES),
        judged by the declared Content-Length before any byte is read or by the bytes counted
        while a chunked body is read; the connection is closed after the response
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Payload Too Large
            status: 413
            detail: Request body exceeds 65536 bytes
            instance: /order
    ServerError:
      description: >-
        An unexpected failure; the body is a problem detail without internal details (no
        detail property, no stack trace)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            instance: /order
    ServiceUnavailable:
      description: >-
        The service cannot obtain a database connection: the pool's connection-timeout (5 s)
        elapsed or the database is unreachable; retry after the Retry-After delay. On a POST
        the write may or may not have been applied (the POSTs are not idempotent)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: The service cannot obtain a database connection
            instance: /order
  schemas:
    ProblemDetail:
      title: ProblemDetail
      type: object
      description: RFC 7807 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Present on validation failures
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      required:
        - description
        - customerId
        - productIds
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        customerId:
          type: integer
          format: int64
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: >-
            Ids of the products contained in the order, between 1 and 100 of them, without
            repetition; every id must exist
          items:
            type: integer
            format: int64
    CreateProductRequest:
      title: CreateProductRequest
      type: object
      required:
        - description
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
    Product:
      title: Product
      type: object
      required:
        - id
        - description
        - orders
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          description: >-
            Ids of the newest orders that contain this product (the highest ids), at most the
            configured limit (20 by default), in ascending id order; the full list is
            GET /order?productId={id}
          items:
            type: integer
            format: int64
        orderCount:
          type: integer
          format: int64
          description: Total number of orders that contain this product, listed or not
    ProductPage:
      title: ProductPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    ProductCursorPage:
      title: ProductCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    CreateCustomerRequest:
      title: CreateCustomerRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
    Order:
      title: Order
      type: object
      required:
        - id
        - description
        - customer
        - products
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        products:
          type: array
          description: The products contained in the order, ascending by id
          items:
            type: object
            required:
              - id
              - description
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    Customer:
      title: Customer
      type: object
      required:
        - id
        - name
        - orders
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          description: >-
            The newest orders of the customer (the highest ids), at most the configured limit
            (20 by default), in ascending id order; the full list is GET /order?customerId={id}
          items:
            type: object
            required:
              - id
              - description
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
        orderCount:
          type: integer
          format: int64
          description: Total number of orders of the customer, listed or not
    OrderPage:
      title: OrderPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    OrderCursorPage:
      title: OrderCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    CustomerPage:
      title: CustomerPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    CustomerCursorPage:
      title: CustomerCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    Page:
      title: Page
      type: object
      description: Offset page envelope, returned when after is absent
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
          description: Zero-based index of this page
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CursorPage:
      title: CursorPage
      type: object
      description: Cursor page envelope, returned when after is present; it carries no totals
      required:
        - content
        - size
        - nextCursor
      properties:
        content:
          type: array
          items: {}
        size:
          type: integer
          description: The requested page size; the content may be shorter on the last page
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: >-
            The id of the last element when more elements exist, to pass as after on the next
            request; null when the walk is complete
tags:
  - name: store
    description: store operations
