openapi: 3.0.0
info:
  title: store
  version: '3.1.0'
  description: A simple store of customers, the orders they place and the products in each order.
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'http://localhost:8080'
    description: >-
      Local development. In production the gateway sets the public URL (ADR 0002).
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/customerId'
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/orderSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of orders, or a cursor page when after is set.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderPage'
                  - $ref: '#/components/schemas/OrderCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getOrders
      description: >-
        Pages of orders with their customer and products. Filter by customerId or productId, not both. Use after for cursor paging.
    post:
      summary: Create Order
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Created, or the replayed answer to a repeated Idempotency-Key.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createOrder
      description: >-
        Create an order for an existing customer with 1 to 100 existing products.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  /order/{id}:
    get:
      summary: Get Order
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Order id, in plain decimal digits.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getOrder
      description: Get one order with its customer and products.
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      parameters:
        - name: name
          in: query
          required: false
          description: >-
            One word, matched anywhere in a customer's name, ignoring case. A space or control character is a 400.
          schema:
            type: string
            pattern: '^[^ \t\r\n\f\u000B\u0000-\u001F\u007F]+$'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/customerSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of customers, or a cursor page when after is set.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerPage'
                  - $ref: '#/components/schemas/CustomerCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getCustomers
      description: >-
        Pages of customers with their newest orders. Filter by a word in the name with name. Use after for cursor paging.
    post:
      summary: Create Customer
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Created, or the replayed answer to a repeated Idempotency-Key.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createCustomer
      description: Create a customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
  /customer/{id}:
    get:
      summary: Get Customer
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Customer id, in plain decimal digits.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getCustomer
      description: >-
        Get one customer with their newest orders and orderCount.
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/productSort'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: A page of products, or a cursor page when after is set.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProductPage'
                  - $ref: '#/components/schemas/ProductCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getProducts
      description: >-
        Pages of products with the ids of their newest orders and orderCount. Use after for cursor paging.
    post:
      summary: Create Product
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          description: Created, or the replayed answer to a repeated Idempotency-Key.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: createProduct
      description: Create a product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
  /products/{id}:
    get:
      summary: Get Product
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Product id, in plain decimal digits.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getProduct
      description: >-
        Get one product with the ids of its newest orders and orderCount.
components:
  parameters:
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        ETag from an earlier response. If it still matches, the answer is a 304 with no body.
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional key, such as a UUID: 1 to 255 visible ASCII characters. Repeating a request with the same key replays the first answer; the same key with a different request is a 422.
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,255}$'
        minLength: 1
        maxLength: 255
    page:
      name: page
      in: query
      description: >-
        Page number from 0, at most 21474836. An empty value counts as absent.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 21474836
        default: 0
    size:
      name: size
      in: query
      description: >-
        Page size, 20 by default; larger values are capped at 100. An empty value counts as absent.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
    after:
      name: after
      in: query
      required: false
      description: >-
        Cursor: items with an id greater than this, in id order (0 starts). Not combinable with page or a non-id sort. An empty value counts as absent.
      schema:
        type: integer
        format: int64
        minimum: 0
    customerId:
      name: customerId
      in: query
      required: false
      description: >-
        Only the orders of this customer. Not combinable with productId. An empty value counts as absent.
      schema:
        type: integer
        format: int64
        minimum: 1
    productId:
      name: productId
      in: query
      required: false
      description: >-
        Only the orders that contain this product. Not combinable with customerId. An empty value counts as absent.
      schema:
        type: integer
        format: int64
        minimum: 1
    orderSort:
      name: sort
      in: query
      description: >-
        property,asc or property,desc, where property is id or description. Default: id.
      schema:
        type: string
    customerSort:
      name: sort
      in: query
      description: >-
        property,asc or property,desc, where property is id or name. Default: id.
      schema:
        type: string
    productSort:
      name: sort
      in: query
      description: >-
        property,asc or property,desc, where property is id or description. Default: id.
      schema:
        type: string
  headers:
    RequestId:
      description: >-
        Correlation id of the request: a valid inbound X-Request-Id, or a new UUID.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
        example: 7f3c2a1e-9b4d-4c6e-8a2f-1d5e6f7a8b9c
    Location:
      description: >-
        Path of the created resource.
      required: true
      schema:
        type: string
        example: /order/10001
    RetryAfter:
      description: >-
        Seconds to wait before retrying.
      required: true
      schema:
        type: string
        example: '5'
    IdempotentReplayed:
      description: >-
        true when this 201 replays an earlier request with the same Idempotency-Key.
      required: false
      schema:
        type: string
        enum:
          - 'true'
    ETag:
      description: >-
        Weak validator of the body; send it back in If-None-Match.
      required: true
      schema:
        type: string
    CacheControl:
      description: >-
        Always no-cache: revalidate with If-None-Match before reusing the response.
      required: true
      schema:
        type: string
        example: no-cache
  responses:
    NotModified:
      description: >-
        Unchanged since the ETag in If-None-Match; the body is empty.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    BadRequest:
      description: >-
        The request is invalid; code says why and errors names the fields.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownSortProperty:
              summary: GET /order?sort=customer.name
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: 'Unknown sort property: customer.name'
                instance: /order
                code: invalid_sort
            cursorWithPage:
              summary: GET /order?after=0&page=1
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: after cannot be combined with page or sort
                instance: /order
                code: invalid_cursor
            combinedFilters:
              summary: GET /order?customerId=1&productId=2
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: customerId and productId cannot be combined
                instance: /order
                code: conflicting_filters
            invalidIdempotencyKey:
              summary: POST /customer with an Idempotency-Key holding a space
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Idempotency-Key must be 1 to 255 visible ASCII characters
                instance: /customer
                code: invalid_idempotency_key
    NotFound:
      description: >-
        The id in the path, or a customer or product named in the body, does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownOrder:
              summary: GET /order/999999
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Order with id 999999 was not found
                instance: /order/999999
                code: not_found
            unknownProduct:
              summary: GET /products/999999
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Product with id 999999 was not found
                instance: /products/999999
                code: not_found
            unknownCustomer:
              summary: GET /customer/999999
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Customer with id 999999 was not found
                instance: /customer/999999
                code: not_found
    NotAcceptable:
      description: >-
        The Accept header admits neither application/json nor application/problem+json.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            orderAsXml:
              summary: GET /order/1 with Accept application/xml
              value:
                type: about:blank
                title: Not Acceptable
                status: 406
                detail: 'Acceptable representations: [application/json, application/problem+json].'
                instance: /order/1
                code: not_acceptable
    Conflict:
      description: >-
        A database constraint rejected the write (conflict), or the first request with this Idempotency-Key is still running (idempotency_request_in_progress).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: >-
            Sent with idempotency_request_in_progress only; always 1.
          required: false
          schema:
            type: string
            example: '1'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            constraintViolation:
              summary: POST /order whose insert a database constraint rejects
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: The request conflicts with existing data
                instance: /order
                code: conflict
            requestInProgress:
              summary: POST /customer repeated with its Idempotency-Key while the first request is still running
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: A request with this Idempotency-Key is still in progress
                instance: /customer
                code: idempotency_request_in_progress
    UnprocessableEntity:
      description: >-
        The Idempotency-Key was already used for a different request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            idempotencyKeyReused:
              summary: POST /customer with the Idempotency-Key of an earlier request and another name
              value:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Idempotency-Key was already used with a different request
                instance: /customer
                code: idempotency_key_reused
    PayloadTooLarge:
      description: >-
        The JSON body is larger than 64 KiB (REQUEST_MAX_BODY_BYTES).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Payload Too Large
            status: 413
            detail: Request body exceeds 65536 bytes
            instance: /order
            code: payload_too_large
    UnsupportedMediaType:
      description: >-
        The Content-Type is missing or is not application/json.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Content-Type 'text/plain;charset=UTF-8' is not supported.
            instance: /order
            code: unsupported_media_type
    ServerError:
      description: >-
        An unexpected failure; no internal details are returned.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            instance: /order
            code: internal_error
    ServiceUnavailable:
      description: >-
        The database is unavailable or did not answer in time; retry after Retry-After.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            serviceUnavailable:
              summary: GET /order?size=5 whose database connection is lost
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The service cannot obtain a database connection
                instance: /order
                code: service_unavailable
            databaseTimeout:
              summary: GET /order?size=5 whose statement is cancelled
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The database did not answer in time
                instance: /order
                code: database_timeout
  schemas:
    ProblemDetail:
      title: ProblemDetail
      type: object
      description: RFC 7807 problem details
      required:
        - code
      properties:
        type:
          type: string
          format: uri
          description: Always about:blank; the problem is identified by code
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: >-
            Stable identity of the problem: branch on code, not on detail, and handle an unknown code by its status.
          enum:
            - validation_failed
            - invalid_parameter
            - unknown_property
            - malformed_body
            - invalid_sort
            - invalid_cursor
            - conflicting_filters
            - not_found
            - conflict
            - payload_too_large
            - unsupported_media_type
            - not_acceptable
            - method_not_allowed
            - service_unavailable
            - database_timeout
            - invalid_idempotency_key
            - idempotency_key_reused
            - idempotency_request_in_progress
            - internal_error
        errors:
          type: array
          description: >-
            The offending fields, each with a message.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      additionalProperties: false
      example:
        description: Analytical Engine
        customerId: 1
        productIds:
          - 2
          - 8
      required:
        - description
        - customerId
        - productIds
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Non-blank, single-line text.
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
        customerId:
          type: integer
          format: int64
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: >-
            1 to 100 distinct product ids; every one must exist.
          items:
            type: integer
            format: int64
    CreateProductRequest:
      title: CreateProductRequest
      type: object
      additionalProperties: false
      example:
        description: Brass Gear
      required:
        - description
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Non-blank, single-line text.
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    Product:
      title: Product
      type: object
      required:
        - id
        - description
        - orders
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          description: >-
            Ids of the newest orders that contain this product (20 by default), ascending. GET /order?productId= lists them all.
          items:
            type: integer
            format: int64
        orderCount:
          type: integer
          format: int64
          description: Number of orders that contain this product.
    ProductPage:
      title: ProductPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    ProductCursorPage:
      title: ProductCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    CreateCustomerRequest:
      title: CreateCustomerRequest
      type: object
      additionalProperties: false
      example:
        name: Ada Lovelace
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Non-blank, single-line text.
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    Order:
      title: Order
      type: object
      required:
        - id
        - description
        - customer
        - products
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        products:
          type: array
          description: >-
            The products in the order, ascending by id. Orders created before products existed may have none.
          items:
            type: object
            required:
              - id
              - description
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    Customer:
      title: Customer
      type: object
      required:
        - id
        - name
        - orders
        - orderCount
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          description: >-
            The customer's newest orders (20 by default), ascending. GET /order?customerId= lists them all.
          items:
            type: object
            required:
              - id
              - description
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
        orderCount:
          type: integer
          format: int64
          description: Number of the customer's orders.
    OrderPage:
      title: OrderPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    OrderCursorPage:
      title: OrderCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Order'
    CustomerPage:
      title: CustomerPage
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    CustomerCursorPage:
      title: CustomerCursorPage
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    Page:
      title: Page
      type: object
      description: Offset page, returned when after is absent.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
          description: Zero-based index of this page
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CursorPage:
      title: CursorPage
      type: object
      description: Cursor page, returned when after is set; it has no totals.
      required:
        - content
        - size
        - nextCursor
      properties:
        content:
          type: array
          items: {}
        size:
          type: integer
          description: The requested page size.
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: >-
            Pass as after to get the next page; null at the end.
tags:
  - name: store
    description: store operations
