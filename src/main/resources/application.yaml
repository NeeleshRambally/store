spring:
  application:
    name: store
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/store}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        reWriteBatchedInserts: true
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT:10s}"
        socketTimeout: ${DB_SOCKET_TIMEOUT:15}
        cancelSignalTimeout: 3
        tcpKeepAlive: true
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        id.optimizer.pooled.preferred: pooled-lo
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  transaction:
    default-timeout: ${TX_TIMEOUT:15s}
  data:
    web:
      pageable:
        max-page-size: 100
  cache:
    type: ${CACHE_TYPE:caffeine}
    cache-names: orders,products
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=${CACHE_TTL:60s},recordStats
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    parser:
      strict-duplicate-detection: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  lifecycle:
    timeout-per-shutdown-phase: 20s

store:
  nested-orders:
    limit: ${NESTED_ORDERS_LIMIT:20}
  request:
    max-body-bytes: ${REQUEST_MAX_BODY_BYTES:65536}

server:
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
    max-http-form-post-size: ${REQUEST_MAX_BODY_BYTES:65536}B
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1KB

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
          show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
