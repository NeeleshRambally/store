databaseChangeLog:
  - changeSet:
      id: 8-index-order-customer-id-id
      author: developer@securitease.com
      comment: Serves the customerId filter of GET /order, where customer_id = ? order by id, as one index range in id order
      runInTransaction: false
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP INDEX CONCURRENTLY IF EXISTS idx_order_customer_id_id;
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_order_customer_id_id ON "order" (customer_id, id);
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_order_customer_id_id;
  - changeSet:
      id: 8-index-order-product-product-id-order-id
      author: developer@securitease.com
      comment: Serves the productId filter of GET /order, a product's order ids in id order, as one index range
      runInTransaction: false
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP INDEX CONCURRENTLY IF EXISTS idx_order_product_product_id_order_id;
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_order_product_product_id_order_id ON order_product (product_id, order_id);
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_order_product_product_id_order_id;
  - changeSet:
      id: 8-drop-index-order-product-product-id
      author: developer@securitease.com
      comment: idx_order_product_product_id_order_id serves every statement that used this index, which now only adds work to each insert
      runInTransaction: false
      changes:
        - sql:
            dbms: postgresql
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_order_product_product_id;
      rollback:
        - sql:
            sql: |
              DROP INDEX CONCURRENTLY IF EXISTS idx_order_product_product_id;
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_order_product_product_id ON order_product (product_id);
