# The README path: a local PostgreSQL on 5433 with admin:admin and the sample data; never used by the image or CI.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/store}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  liquibase:
    contexts: ${LIQUIBASE_CONTEXTS:seed}
