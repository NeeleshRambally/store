# The README path: PostgreSQL on 5433 with admin:admin, the sample data and SQL logging; excluded from the bootJar.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/store}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  liquibase:
    contexts: ${LIQUIBASE_CONTEXTS:seed}
logging:
  level:
    org.hibernate.SQL: debug
