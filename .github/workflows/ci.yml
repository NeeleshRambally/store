name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: utils/package-lock.json

      - name: Test the data generator
        working-directory: utils
        run: npm ci && npm test

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and run all tests
        run: ./gradlew spotlessCheck build test --rerun --no-daemon

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  docker:
    name: docker
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      STORE_IMAGE: store:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: store:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: store:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: store:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Start the stack
        id: stack
        run: docker compose up -d --no-build

      - name: Smoke test
        id: smoke
        run: sh scripts/smoke-test.sh http://localhost:8080 http://localhost:8081 compose

      - name: Container logs
        if: failure() && (steps.stack.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: docker compose logs migrate store

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Push the scanned and smoke-tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker tag store:ci "$tag" && docker push "$tag"
          done
