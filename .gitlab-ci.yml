stages:
  - build
  - package
  - smoke
  - scan
  - publish

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: docker

build:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  services:
    - docker:27-dind
  cache:
    key: gradle
    paths:
      - .gradle/caches
      - .gradle/wrapper
  script:
    - ./gradlew spotlessCheck build test --rerun
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/reports/

package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker save "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

smoke:
  stage: smoke
  image: docker:27
  services:
    - docker:27-dind
  needs: [package]
  variables:
    STORE_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - apk add --no-cache curl
    - docker load -i image.tar
    - docker compose up -d --no-build
    - sh scripts/smoke-test.sh http://docker:8080 http://docker:8081
  after_script:
    - if [ "$CI_JOB_STATUS" = "failed" ]; then docker compose logs store; fi
    - docker compose down -v

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  needs: [package]
  script:
    - trivy image --input image.tar --severity CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 --format table
    - trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  needs: [package, smoke, scan]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker load -i image.tar
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
