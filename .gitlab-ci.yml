stages:
  - build
  - package
  - scan

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: docker

build:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  services:
    - docker:27-dind
  cache:
    key: gradle
    paths:
      - .gradle/caches
      - .gradle/wrapper
  script:
    - ./gradlew spotlessCheck build
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/reports/

package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker save "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -o image.tar
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  needs: [package]
  script:
    - trivy image --input image.tar --severity CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 --format table
    - trivy image --input image.tar --format cyclonedx --output sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json
